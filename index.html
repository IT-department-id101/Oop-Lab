<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;padding:20px;direction:rtl}
.container{max-width:1200px;margin:0 auto}
.labs{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:440px;margin:0 auto 22px;direction:ltr}
.lab{padding:16px 10px;background:#16a34a;border:3px solid #15803d;border-radius:14px;color:#fff;cursor:pointer;font-size:20px;font-weight:900;font-family:inherit;letter-spacing:.5px;box-shadow:0 5px 14px rgba(0,0,0,.3);transition:all .25s}
.lab:hover{background:#22c55e;transform:translateY(-2px)}
.lab.active{background:#14532d;border-color:#fff;box-shadow:0 0 0 3px #22c55e,0 6px 16px rgba(0,0,0,.4)}
.labs-hr{border:0;height:3px;background:rgba(255,255,255,.55);border-radius:3px;max-width:440px;margin:0 auto 22px}
.tabs{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;justify-content:center}
.tab{padding:12px 22px;background:rgba(255,255,255,.2);border:none;border-radius:8px;color:#fff;cursor:pointer;font-size:15px;font-weight:bold;transition:all .3s;backdrop-filter:blur(10px)}
.tab:hover{background:rgba(255,255,255,.3);transform:translateY(-2px)}
.tab.active{background:#fff;color:#667eea;box-shadow:0 4px 15px rgba(0,0,0,.2)}
.content{display:none}.content.active{display:block;animation:fadeIn .4s}
@keyframes fadeIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.example{background:#fff;border-radius:12px;padding:24px;margin-bottom:24px;box-shadow:0 8px 28px rgba(0,0,0,.18)}
.title-row{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.example-title{flex:1;background:linear-gradient(135deg,#e0f2fe,#bae6fd);padding:14px 18px;border-radius:8px;font-size:17px;font-weight:bold;color:#0c4a6e}
.pdf-page{background:#f97316;color:#fff;font-size:11px;font-weight:bold;padding:5px 11px;border-radius:20px;white-space:nowrap;direction:ltr;box-shadow:0 2px 6px rgba(249,115,22,.35)}
.code-box{background:#1e1e1e;border-radius:10px;margin-bottom:18px;overflow:hidden;border:1px solid #333;display:flex;direction:ltr}
.line-numbers{background:#2d2d2d;border-left:4px solid #5cb85c;padding:18px 0;min-width:42px;text-align:center;font-family:Consolas,Monaco,monospace;font-size:15px;color:#858585;line-height:1.7;user-select:none;flex-shrink:0}
.line-numbers span{display:block;padding:0 8px}
.code-content{padding:18px 20px;overflow-x:auto;flex:1}
.code-content pre{font-family:Consolas,Monaco,monospace;line-height:1.7;white-space:pre;color:#e2e8f0;font-size:15px;text-align:left}
.kw{color:#d4a574;font-weight:700}.dt{color:#bb86fc;font-weight:700}.con{color:#4fc3f7;font-weight:600}.num{color:#b5cea8}.str{color:#ce9178}.cmt{color:#6a9955;font-style:italic}
.output-box{background:linear-gradient(135deg,#dbeafe,#bfdbfe);border:2px solid #3b82f6;border-radius:8px;padding:14px 18px;margin-bottom:18px;direction:ltr;overflow-x:auto}
.output-header{font-weight:bold;color:#1e40af;margin-bottom:8px;font-size:15px}
.output-content{color:#1e3a8a;font-family:Consolas,monospace;font-size:14px;line-height:1.8;white-space:pre;text-align:left}
.expl-box{background:linear-gradient(135deg,#f0fdf4,#dcfce7);border:1.5px solid #86efac;border-right:6px solid #22c55e;border-radius:14px;padding:22px 24px}
.expl-title{font-weight:800;color:#166534;margin-bottom:14px;font-size:16px;border-bottom:2px dashed #86efac;padding-bottom:10px}
.expl-box ul{list-style:none}
.expl-box li{margin-bottom:11px;line-height:2;font-size:15px;color:#1c1917;padding:10px 14px;background:#fff;border-radius:9px;border-right:4px solid #22c55e;display:flex;gap:10px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.rng{flex-shrink:0;min-width:36px;height:24px;line-height:22px;text-align:center;background:#dcfce7;color:#166534;font-weight:800;border:1.5px solid #22c55e;border-radius:5px;padding:0 6px;font-size:13px;margin-top:6px}.sn{direction:ltr;unicode-bidi:isolate;font-family:Consolas,monospace;font-size:13px;display:inline-block;max-width:100%;overflow-x:auto;white-space:nowrap;vertical-align:middle}.sn.sm{font-size:10px}
.ln{background:#22c55e;color:#fff;font-weight:700;font-size:13px;padding:0 10px;border-radius:20px;height:26px;line-height:26px;flex-shrink:0;margin-top:5px;direction:ltr}
.expl-box b{color:#0369a1;background:#dbeafe;padding:1px 7px;border-radius:5px;direction:ltr;display:inline-block;font-family:Consolas,monospace;font-size:13px}
.expl-box code{background:#1e1e1e;color:#ce9178;padding:2px 7px;border-radius:5px;font-size:13px;font-family:Consolas,monospace;direction:ltr;display:inline-block}
.intro{background:#fff;border-radius:12px;padding:30px;text-align:center;box-shadow:0 8px 28px rgba(0,0,0,.18)}
.intro h2{color:#667eea;margin-bottom:18px;font-size:1.9em}.intro p{color:#4b5563;line-height:1.8;margin-bottom:12px}
.expl-box li{flex-direction:column;align-items:flex-start;gap:6px}
.expl-box li>span:last-child{width:100%}
.expl-box .rng{min-width:30px;height:20px;line-height:18px;font-size:12px;padding:0 5px;border-radius:4px;margin-top:0}
.expl-box .sn{display:block;width:fit-content;max-width:100%;margin-bottom:6px;white-space:pre;text-align:left}
.expl-box .sn{overflow:visible;overflow-x:visible;white-space:normal;overflow-wrap:anywhere}
.sn.xs{font-size:8px}
.cls{color:#4ec9b0}.fn{color:#dcdcaa}.var{color:#9cdcfe}.op{color:#ff79c6}
.more-btn{display:block;width:100%;margin-top:16px;padding:14px;border:none;border-radius:10px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-size:16px;font-weight:bold;cursor:pointer;font-family:inherit;box-shadow:0 4px 14px rgba(102,126,234,.35)}
.more-panel{display:none;margin-top:14px;background:#f5f3ff;border:1.5px solid #c4b5fd;border-right:6px solid #7c3aed;border-radius:14px;padding:20px}
.more-panel.open{display:block;animation:fadeIn .4s}
.more-title{font-weight:800;color:#5b21b6;font-size:16px;margin-bottom:10px}
.more-intro,.more-sum{line-height:2;color:#1c1917;font-size:15px;margin-bottom:14px}
.more-panel code{background:#1e1e1e;color:#ce9178;padding:2px 7px;border-radius:5px;font-size:13px;font-family:Consolas,monospace;direction:ltr;display:inline-block}
.st{background:#fff;border:1.5px solid #ddd6fe;border-right:5px solid #7c3aed;border-radius:12px;padding:12px 14px;margin-bottom:10px}
.st-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.st-h .rng{margin-top:0;min-width:30px;height:20px;line-height:18px;font-size:12px;padding:0 5px;border-radius:4px}
.st-h .sn{white-space:normal;overflow:visible;overflow-wrap:anywhere;background:#dbeafe;color:#0369a1;padding:1px 7px;border-radius:5px}
.st p{line-height:2;font-size:15px;color:#1c1917;margin-bottom:8px}
.st-v{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;color:#6b7280}
.vs{font-style:normal;background:#ede9fe;color:#4c1d95;border-radius:6px;padding:1px 8px;font-family:Consolas,monospace;direction:ltr;font-size:13px;font-weight:700}
.st p{font-size:16px;line-height:2.1}
.walk{background:#fff;border:1.5px solid #86efac;border-radius:10px;padding:12px 14px;margin-bottom:14px;line-height:2;font-size:15px;color:#1c1917}.more-panel .walk{border-color:#c4b5fd;margin-bottom:14px}
.walk .wl{display:block;font-weight:800;color:#166534;margin-bottom:4px}.more-panel .walk .wl{color:#5b21b6}
.walk code{background:#1e1e1e;color:#ce9178;padding:2px 7px;border-radius:5px;font-size:13px;font-family:Consolas,monospace;direction:ltr;display:inline-block}
.expl-box .rng,.st-h .rng{min-width:0;padding:0 8px;white-space:nowrap}
.code-box.pinned{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;max-height:42vh;overflow:auto;align-items:flex-start;box-shadow:0 8px 22px rgba(0,0,0,.45)}
.code-box.pinned .line-numbers{font-size:12px}.code-box.pinned .code-content pre{font-size:12px}
.container{padding-bottom:80px}
.pin-wrap{display:none;position:fixed;left:16px;bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:100;flex-direction:column;align-items:flex-start;gap:8px;direction:ltr}
.pin-wrap.show{display:flex}
.pin-pill{background:#fff;color:#111;font:600 15px 'Segoe UI',Tahoma,sans-serif;padding:8px 14px;border-radius:14px;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.pin-fab{width:58px;height:58px;border:none;border-radius:18px;background:#7c3aed;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 14px rgba(0,0,0,.35);cursor:pointer}
.pin-wrap.on .pin-fab{background:#1fa855}.pin-wrap.on svg path:last-child{fill:#fff}
.code-box.pinned.wide{width:100vw;margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw);border-radius:0;border-left:0;border-right:0}
.pin-fab{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.code-box.pinned{position:fixed;margin:0}
.code-box.pinned.wide{left:0;width:100vw;margin:0;border-radius:0;border-left:0;border-right:0}
.pin2 .pin-fab{background:#dc2626}.pin2.on .pin-fab{background:#f97316}
.code-box.pinned.dim{visibility:hidden}
.output-box{padding:7px 12px;border-width:1.5px;border-radius:6px;margin-bottom:12px}
.output-header{font-size:12px;margin-bottom:3px}
.output-content{font-size:11px;line-height:1.5}
.st-h{flex-direction:column;align-items:flex-start;gap:6px}
.pin-fab{box-sizing:border-box;outline:none;-webkit-tap-highlight-color:transparent}
.pin-fab svg{transition:transform .2s}
.pin-wrap.full .pin-fab{border:4px solid #7c3aed}
.pin2.full .pin-fab{border-color:#dc2626}
.pin-wrap.full svg{transform:rotate(45deg)}
.usr{color:#fff;font-weight:800}
.pin-wrap.dock{left:0}
.pin-wrap.dock .pin-fab{opacity:.45;transform:translateX(-32px)}
.pin-wrap.dock .pin-pill{opacity:0;pointer-events:none}
.pin-fab{transition:transform .2s ease,background .2s,opacity .2s}
.pin-fab{touch-action:none;transition:transform .2s ease,background .2s}
.pin-fab.drag{transition:none;box-shadow:0 10px 24px rgba(0,0,0,.45)}
.pin-pill{transition:background .15s,color .15s}
.pin-pill{white-space:nowrap;max-width:calc(100vw - 24px);font-size:13px;line-height:1.6;padding:8px 12px}
.pin-pill.hint{background:#7c3aed;color:#fff}.pin2 .pin-pill.hint{background:#dc2626}
.fb-box{margin-top:26px;padding:22px;background:linear-gradient(135deg,#f5f3ff,#ede9fe);border:1.5px solid #c4b5fd;border-radius:14px;text-align:right}
.fb-title{font-weight:800;color:#5b21b6;font-size:17px;margin-bottom:6px}
.fb-sub{color:#6b5b95;font-size:13.5px;margin-bottom:14px;line-height:1.8}
.fb-quick{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.fb-qbtn{flex:1;min-width:140px;padding:10px 14px;border:1.5px solid #ddd6fe;background:#fff;border-radius:10px;color:#5b21b6;font-weight:700;font-size:14.5px;cursor:pointer;font-family:inherit;transition:.2s}
.fb-qbtn:hover{background:#ede9fe;border-color:#a78bfa}
.fb-overlay{display:none;position:fixed;inset:0;background:rgba(17,12,34,.55);z-index:200;align-items:center;justify-content:center;padding:20px}
.fb-overlay.open{display:flex}
.fb-dialog{background:#fff;border-radius:16px;padding:22px;max-width:360px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.4);text-align:center}
.fb-dialog h3{color:#5b21b6;font-size:17px;margin-bottom:14px}
.fb-dialog .fb-qbtn{width:100%;margin-bottom:10px;text-align:center}
.fb-dialog-cancel{width:100%;padding:10px;border:none;background:#f3f4f6;color:#4b5563;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;margin-top:4px}
.fb-area{width:100%;min-height:84px;padding:12px 14px;border:1.5px solid #ddd6fe;border-radius:10px;font-family:inherit;font-size:14.5px;resize:vertical;color:#1c1917;box-sizing:border-box;margin-bottom:12px}
.fb-area:focus{outline:none;border-color:#7c3aed}
.fb-send{width:100%;padding:12px;border:none;border-radius:10px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit;box-shadow:0 4px 12px rgba(102,126,234,.3)}
.fb-send:hover{filter:brightness(1.07)}
.fb-send:disabled{opacity:.6;cursor:default}
.fb-send2{background:linear-gradient(135deg,#f97316,#ea580c);box-shadow:0 4px 12px rgba(234,88,12,.3);margin-top:10px}
.fb-msg{margin-top:10px;text-align:center;font-size:13.5px;font-weight:700;border-radius:8px;padding:9px;display:none}
.fb-msg.ok{display:block;background:#dcfce7;color:#166534}
.fb-msg.err{display:block;background:#fee2e2;color:#991b1b}
.code-tools{display:flex;align-items:center;gap:14px;margin-bottom:10px;direction:rtl;flex-wrap:wrap}
.copy-btn{padding:8px 14px;border:none;border-radius:8px;background:#1e1e1e;color:#fff;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;transition:.2s}
.copy-btn.done{background:#16a34a}
.ku-sw{display:flex;align-items:center;gap:10px;padding:2px 14px 2px 10px;border:1.5px solid #bae6fd;border-radius:999px;background:#f0f9ff;font-weight:700;font-size:13px;color:#0c4a6e;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;transition:background .25s,border-color .25s,color .25s}
.ku-sw:has(input:checked){background:#dbeafe;border-color:#60a5fa;color:#1d4ed8}
.ku-sw input{display:none}
.ku-sw .sw{position:relative;display:inline-block;width:54px;height:22px;margin:8px 4px;border-radius:11px;background:#cbd5e1;transition:background .25s;direction:ltr}
.ku-sw .sw::after{content:'';position:absolute;top:-6px;left:-3px;width:34px;height:34px;border-radius:50%;background:#94a3b8;box-shadow:0 2px 6px rgba(0,0,0,.28);transition:left .25s,background .25s,box-shadow .25s}
.ku-sw input:checked+.sw{background:#93c5fd}
.ku-sw input:checked+.sw::after{left:23px;background:#2563eb;box-shadow:0 0 14px rgba(37,99,235,.7)}
</style>

<script>

{t:'Print with TAB – چاپکردن بە بۆشایی TAB',p:'PDF P.2',c:'// \\t بۆشاییەکی تاب دروست دەکات\nConsole.Write("HELLO WORLD\\t");\nConsole.Write("Welcome students");',o:'HELLO WORLD     Welcome students'},

,{t:'Table with 4 Statements – خشتە بە چوار فەرمان',p:'PDF P.4',c:'// هەر هێڵی خشتەکە بە فەرمانێکی جیا چاپ دەکرێت\nConsole.WriteLine("Subject\\tMarks");\nConsole.WriteLine("Mathematics\\t90");\nConsole.WriteLine("Computer\\t80");\nConsole.WriteLine("IT\\t67");',o:'Subject\tMarks\nMathematics\t90\nComputer\t80\nIT\t67'}

[['Console.Write("Subject\\tMarks\\nMathematics\\t90\\nComputer\\t80\\nIT\\t67");','دەقێکی درێژ لە یەک فەرماندا. <code>\\t</code> بۆشاییی تاب دروست دەکات و <code>\\n</code> دەچێتە هێڵی نوێ، بۆیە چوار هێڵی خشتەکە دەردەکەون.']],
[['Console.WriteLine("Subject\\tMarks");','<code>WriteLine</code> دەقی Subject دەنووسێت، <code>\\t</code> بۆشاییەکی تاب دروست دەکات، Marks دەنووسێت و دەچێتە هێڵی نوێ. ئەمە هێڵی یەکەمی خشتەکەیە.'],['Console.WriteLine("Mathematics\\t90");','Mathematics دەنووسێت، <code>\\t</code> بۆشایی دروست دەکات، 90 دەنووسێت و دەچێتە هێڵی نوێ.'],['Console.WriteLine("Computer\\t80");','Computer دەنووسێت، بۆشایی تاب، 80، و دەچێتە هێڵی نوێ.'],['Console.WriteLine("IT\\t67");','IT دەنووسێت، بۆشایی تاب، 67، و دەچێتە هێڵی نوێ. لێرەدا <code>\\t</code> دەبێتە هۆی ئەوەی 67 لەگەڵ 90 و 80 لە یەک ستوون بێت.']]
],EXSUM:['ئەم پرۆگرامە تەنها یەک فەرمانی هەیە: <code>Console.Write("HELLO WORLD");</code>. <code>Console</code> واتە شاشەی کۆنسۆڵ و <code>Write</code> واتە بنووسە. کۆمپیوتەر ئەو دەقەی لەنێوان دوو نیشانەی <code>" "</code> داندراوە وەک خۆی دەخوێنێتەوە و لەسەر شاشە دەینووسێت: HELLO WORLD. چونکە <code>Write</code>ـە، دوای دەقەکە ناچێتە هێڵی نوێ و نیشانەی نووسین (cursor) لە کۆتایی دەقەکە دەمێنێتەوە.',
'سەرەتا فەرمانی یەکەم دەقی HELLO WORLD دەنووسێت و دوای ئەوە <code>\\t</code> دەبینێت. <code>\\t</code> نیشانەی تابە، واتە نیشانەی نووسین دەباتە شوێنی تابی داهاتوو و بۆشاییەکی گەورە دروست دەبێت. چونکە <code>Write</code>ـە، ناچێتە هێڵی نوێ. دواتر فەرمانی دووەم لەسەر هەمان هێڵ، دوای بۆشاییەکە، Welcome students دەنووسێت. ئەنجام: HELLO WORLD، بۆشایی، Welcome students، هەموو لەسەر یەک هێڵ.',
'فەرمانی یەکەم <code>WriteLine</code> بەکاردێنێت: دەقی HELLO WORLD دەنووسێت (بۆشاییەکی لە کۆتاییدایە) و دوای ئەوە نیشانەی نووسین دەباتە سەرەتای هێڵی نوێ. فەرمانی دووەم <code>Write</code>ـە و Welcome students لەو هێڵە نوێیە دەنووسێت، چونکە نیشانەی نووسین ئێستا لەوێیە. ئەنجام: HELLO WORLD لە هێڵی یەکەم و Welcome students لە هێڵی دووەم. جیاوازییەکە: <code>Write</code> لەسەر هەمان هێڵ دەمێنێتەوە، بەڵام <code>WriteLine</code> دەچێتە هێڵی نوێ.',
'فەرمانی یەکەم HELLO WORLD دەنووسێت، پاشان <code>\\n</code> دەبینێت. <code>\\n</code> نیشانەی هێڵی نوێیە، بۆیە نیشانەی نووسین دەچێتە سەرەتای هێڵی دواتر، هەرچەندە فەرمانەکە <code>Write</code>ـە. فەرمانی دووەم Welcome students لەو هێڵە نوێیە دەنووسێت. ئەنجامەکە هەمان ئەنجامی <code>WriteLine</code>ـە، بەڵام بە ڕێگایەکی جیاواز: <code>\\n</code> لە ناو دەقەکەدا.',
'ئەم فەرمانە هەموو خشتەکە لە یەک دەقدا دەنووسێت و کۆمپیوتەر دەقەکە پیت بە پیت دەخوێنێتەوە. سەرەتا Subject دەنووسێت، <code>\\t</code> بۆشایی دروست دەکات، Marks دەنووسێت، و <code>\\n</code> دەچێتە هێڵی نوێ. دواتر Mathematics، بۆشایی، 90، و هێڵی نوێ. دواتر Computer، بۆشایی، 80، و هێڵی نوێ. لە کۆتاییدا IT، بۆشایی، 67. بۆیە چوار هێڵ دروست دەبن: Subject Marks، Mathematics 90، Computer 80، IT 67، و ستوونەکان بە تاب ڕێک دەبن.',
'لەم نموونەدا هەر هێڵی خشتەکە بە <code>WriteLine</code>ی جیا چاپ دەکرێت. هێڵی یەکەم Subject، بۆشایی تاب، Marks و هێڵی نوێ. هێڵی دووەم Mathematics، بۆشایی، 90 و هێڵی نوێ. هێڵی سێیەم Computer، بۆشایی، 80 و هێڵی نوێ. هێڵی چوارەم IT، بۆشایی، 67 و هێڵی نوێ. ئەنجامەکە هەمان ئەنجامی نموونەی پێشووە کە بە یەک <code>Write</code> چاپکرا، بەڵام لێرە <code>\\n</code> پێویست نییە چونکە <code>WriteLine</code> خۆی دەچێتە هێڵی نوێ.'],MORE:[
{c:'Console.Write("Hi");\nConsole.Write(" there");',o:'Hi there',intro:'سەرەتا بە <code>Console.Write</code> دەقی Hiمان چاپ کرد. دواتر بە <code>Console.Write</code>ی دووەم دەقی <code>" there"</code>مان چاپ کرد کە بۆشاییەک لە سەرەتایدا هەیە. لەبەر ئەوەی <code>Write</code> ناچێتە هێڵی نوێ، هەردوو دەق بەدوای یەکدا دێن: Hi there.',s:[['Console.Write("Hi");','کۆمپیوتەر دەقی ناو <code>" "</code> دەخوێنێتەوە (Hi) و لەسەر شاشە دەینووسێت. نیشانەی نووسین (cursor) دوای i دەمێنێتەوە و ناچێتە هێڵی نوێ.',[]],['Console.Write(" there");','کۆمپیوتەر دەقی ئەم هێڵە دەخوێنێتەوە، کە بۆشاییەکی لە سەرەتایە، و دەینووسێت لەو شوێنەی نیشانەی نووسین ماوەتەوە، یانی دوای Hi. بۆیە دەبێتە Hi there.',[]]],sum:'پوختە: <code>Write</code> دەق چاپ دەکات و لەسەر هەمان هێڵ دەمێنێتەوە، بۆیە دەقەکان بەدوای یەکدا دێن.'},
{c:'Console.Write("Name:\\t");\nConsole.Write("Ali");',o:'Name:   Ali',intro:'سەرەتا بە <code>Console.Write</code> دەقی <code>Name:</code>مان چاپ کرد و <code>\\t</code>ی تابمان لەدوا نووسی. دواتر بە <code>Console.Write</code>ی دووەم دەقی Aliمان چاپ کرد. تاب بۆشاییەک دروست دەکات، بۆیە Name: بۆشایی Ali دەبینین.',s:[['Console.Write("Name:\\t");','کۆمپیوتەر Name: دەنووسێت، پاشان <code>\\t</code> دەبینێت. ئەمە نیشانەی تابە، بۆیە نیشانەی نووسین بۆ شوێنی تابی داهاتوو دەچێت و بۆشاییەک دروست دەبێت.',[]],['Console.Write("Ali");','کۆمپیوتەر دەقی Ali دەخوێنێتەوە و دەینووسێت لەو شوێنەی دوای بۆشاییەکەیە. بۆیە Ali دوای بۆشاییەکە دەردەکەوێت.',[]]],sum:'پوختە: <code>\\t</code> بۆشاییەکی تاب دەخاتە نێوان دوو دەق، بۆ ڕێکخستنی دەقەکان.'}
,
{c:'Console.WriteLine("One");\nConsole.Write("Two");',o:'One\nTwo',intro:'سەرەتا بە <code>Console.WriteLine</code> دەقی Oneمان چاپ کرد و دوای ئەوە چووە هێڵی نوێ. دواتر بە <code>Console.Write</code> دەقی Twoمان چاپ کرد لە هێڵی نوێ. بۆیە One لە سەرەوە و Two لە خوارەوە دەردەکەون.',s:[['Console.WriteLine("One");','کۆمپیوتەر دەقی One دەنووسێت و چونکە <code>WriteLine</code>ـە، نیشانەی نووسین دەباتە سەرەتای هێڵی نوێ.',[]],['Console.Write("Two");','کۆمپیوتەر دەقی Two دەخوێنێتەوە و لە شوێنی نیشانەی نووسین دەینووسێت، کە ئێستا هێڵی نوێیە.',[]]],sum:'پوختە: <code>WriteLine</code> دوای چاپ دەچێتە هێڵی نوێ، <code>Write</code> نا.'},
{c:'Console.Write("A\\nB");',o:'A\nB',intro:'بە یەک <code>Console.Write</code> دەقی <code>A\\nB</code>مان چاپ کرد. کۆمپیوتەر سەرەتا A دەنووسێت، پاشان <code>\\n</code> دەبینێت و دەچێتە هێڵی نوێ، و دواتر B دەنووسێت. بۆیە A و B لە دوو هێڵی جیاوازدان.',s:[['Console.Write("A\\nB");','کۆمپیوتەر دەقەکە پیت بە پیت دەخوێنێتەوە: A دەنووسێت، <code>\\n</code> نیشانەی هێڵی نوێیە و نیشانەی نووسین دەباتە هێڵی نوێ، پاشان B دەنووسێت.',[]]],sum:'پوختە: <code>\\n</code> لە ناو دەقدا دەبێتە هۆی چوونە هێڵی نوێ.'},
{c:'Console.Write("Item\\tQty\\nPen\\t5");',o:'Item    Qty\nPen     5',intro:'بە یەک <code>Console.Write</code> دوو هێڵی خشتەمان چاپ کرد. Item بۆشایی Qty، پاشان <code>\\n</code> هێڵی نوێ، و Pen بۆشایی 5. تاب وا دەکات ستوونەکان ڕێک بن.',s:[['Console.Write("Item\\tQty\\nPen\\t5");','کۆمپیوتەر Item دەنووسێت، <code>\\t</code> بۆشاییەکی تاب دروست دەکات، Qty دەنووسێت، <code>\\n</code> دەچێتە هێڵی نوێ، Pen دەنووسێت، دووبارە بۆشایی تاب، و لە کۆتاییدا 5.',[]]],sum:'پوختە: <code>\\t</code> و <code>\\n</code> پێکەوە خشتە دروست دەکەن.'},
{c:'Console.WriteLine("Name\\tAge");\nConsole.WriteLine("Ali\\t20");',o:'Name\tAge\nAli\t20',intro:'سەرەتا بە <code>WriteLine</code> دەقی Name، تاب، Ageمان چاپ کرد و چووە هێڵی نوێ. دواتر بە <code>WriteLine</code>ی دووەم Ali، تاب، 20مان چاپ کرد. بۆیە دوو هێڵ و دوو ستوون دروست بوون.',s:[['Console.WriteLine("Name\\tAge");','کۆمپیوتەر Name دەنووسێت، <code>\\t</code> بۆشاییەکی تاب دروست دەکات، Age دەنووسێت و چونکە <code>WriteLine</code>ـە دەچێتە هێڵی نوێ.',[]],['Console.WriteLine("Ali\\t20");','Ali دەنووسێت، بۆشایی تاب، 20 دەنووسێت و دەچێتە هێڵی نوێ. بۆیە Ali لە ژێر Name و 20 لە ژێر Age دەبێت.',[]]],sum:'پوختە: <code>WriteLine</code> هەر هێڵێک بە جیا چاپ دەکات و <code>\\t</code> ستوونەکان ڕێک دەکات.'}
]},
{E:[

{t:'Sum of Two Numbers – کۆی دوو ژمارە',p:'PDF P.1',c:'int a, b, c;\nConsole.WriteLine( "Enter first number : ");\na=Convert.ToInt32( Console.ReadLine());\nConsole.WriteLine("Enter second number : ");\nb = Convert.ToInt32(Console.ReadLine());\nc = a + b;\nConsole.WriteLine("The Sum is : " + c);',o:'Enter first number :\n4\nEnter second number :\n6\nThe Sum is : 10'}

[['Console.Write("Enter temperature in Fahrenheit: ");','دەقی داواکاری چاپ دەکات بۆ ئەوەی بەکارهێنەر ژمارەیەک بنووسێت.'],['double fahrenheit = Convert.ToDouble(Console.ReadLine());','<code>Console.ReadLine()</code> ئەوەی بەکارهێنەر دەینووسێت دەخوێنێتەوە وەک دەق، <code>Convert.ToDouble</code> دەیکات بە ژمارەی دەهەمی (<code>double</code>) و دەیخاتە ناو fahrenheit.'],['double centigrade = (fahrenheit - 32) * 5 / 9;','فۆرمۆڵەکە: 32 لە fahrenheit کەم دەکاتەوە، لێک دەدات بە 5 و دابەشی دەکات بە 9. بۆ نموونە 212 دەبێتە 100.'],['Console.WriteLine("Temperature in Centigrade: " + centigrade);','دەقەکە لەگەڵ بەهای centigrade بە <code>+</code> دەلکێنێت و چاپی دەکات.']],
[['Console.Write("Enter a character: ");','داوا لە بەکارهێنەر دەکات پیتێک بنووسێت.'],['char ch = Console.ReadLine()[0];','<code>char</code> جۆری یەک پیتە. <code>ReadLine()</code> دەقەکە دەخوێنێتەوە و <code>[0]</code> یەکەم پیتی لێ هەڵدەگرێت و دەیخاتە ناو ch.'],['int asciiValue = (int)ch;','<code>(int)</code> پیتەکە دەگۆڕێت بۆ ژمارەی ASCIIـەکەی. بۆ نموونە A دەبێتە 65.'],['Console.WriteLine("The ASCII value of \'" + ch + "\' is: " + asciiValue);','دەق و پیتەکە و ژمارەکە بە <code>+</code> دەلکێنێت و چاپی دەکات.']],
[['int a, b, c;','سێ گۆڕاوی <code>int</code> (ژمارەی تەواو) بە ناوەکانی a و b و c دروست دەکات.'],['Console.WriteLine( "Enter first number : ");','داوا لە بەکارهێنەر دەکات ژمارەی یەکەم بنووسێت.'],['a=Convert.ToInt32( Console.ReadLine());','ئەوەی بەکارهێنەر دەینووسێت دەخوێنێتەوە و بە <code>Convert.ToInt32</code> دەیکات بە ژمارەی تەواو و دەیخاتە ناو a.'],['Console.WriteLine("Enter second number : ");','داوا لە بەکارهێنەر دەکات ژمارەی دووەم بنووسێت.'],['b = Convert.ToInt32(Console.ReadLine());','هەمان کار بۆ ژمارەی دووەم، و دەیخاتە ناو b.'],['c = a + b;','بەهای a و b کۆدەکاتەوە و ئەنجامەکە دەخاتە ناو c.'],['Console.WriteLine("The Sum is : " + c);','دەقەکە لەگەڵ بەهای c دەلکێنێت و چاپی دەکات.']]
],EXSUM:['سەرەتا <code>Console.Write</code> دەقی داواکاری دەنووسێت و ناچێتە هێڵی نوێ، بۆیە بەکارهێنەر ژمارەکە لەتەنیشتی دەنووسێت. دواتر <code>Console.ReadLine()</code> ئەوەی بەکارهێنەر نووسیویەتی وەک دەق دەخوێنێتەوە (بۆ نموونە "212")، و <code>Convert.ToDouble</code> دەیگۆڕێت بۆ ژمارەی دەهەمی 212 و دەیخاتە ناو گۆڕاوی <code>fahrenheit</code> لە جۆری <code>double</code>. پاشان فۆرمۆڵەکە هەنگاو بە هەنگاو دەژمێردرێت: 212 - 32 = 180، دواتر 180 * 5 = 900، دواتر 900 / 9 = 100، و 100 دەخرێتە ناو <code>centigrade</code>. لە کۆتاییدا <code>WriteLine</code> دەقەکە لەگەڵ 100 دەلکێنێت و چاپی دەکات: Temperature in Centigrade: 100.',
'سەرەتا دەقی داواکاری چاپ دەکات. بۆ نموونە بەکارهێنەر A دەنووسێت. <code>ReadLine()</code> دەقی "A" دەخوێنێتەوە و <code>[0]</code> یەکەم پیتی لێ هەڵدەگرێت، A، و دەیخاتە ناو <code>ch</code> لە جۆری <code>char</code> (یەک پیت). پاشان <code>(int)ch</code> پیتی A دەگۆڕێت بۆ ژمارەی ASCIIـەکەی، 65، و دەیخاتە ناو <code>asciiValue</code> لە جۆری <code>int</code>. لە کۆتاییدا <code>WriteLine</code> دەق و پیتەکە و ژمارەکە بە <code>+</code> دەلکێنێت و چاپی دەکات: The ASCII value of \'A\' is: 65.',

ێت.", []], ["Console.WriteLine(\"Pass\");", "<code>Console.WriteLine</code> دەقی Pass چاپ دەکات.", []], ["else", "<code>else</code> واتە ئەگەرنا؛ چونکە مەرجی if ڕاست بوو، ئەم بەشە ناپشکنرێت.", []], ["Console.WriteLine(\"Fail\");", "ئەگەر mark کەمتر بووایە لە 50، دەقی Fail چاپ دەکرا.", []]], "sum": "پوختە: <code>if</code> یەکەم مەرجی ڕاست هەڵدەگرێت و <code>else</code> بۆ کاتی هەڵەیە."}, {"c": "int d = 7;\nint r = d / 2;\nswitch (r)\n{\n  case 3:\n  case 4:\n    Console.WriteLine(\"Big\");\n    break;\n  default:\n    Console.WriteLine(\"Small\");\n    break;\n}", "o": "Big", "intro": "سەرەتا گۆڕاوی <code>d</code>مان دروست کرد بە بەهای 7. دواتر <code>r</code>مان دروست کرد و 7 / 2 کە لە <code>int</code> دا 3 دەدات تێیدا دانا. بە <code>switch</code> بەهای r (3) بەراورد دەکرێت: case 3 یەکسانە و case 4 هەمان کۆد هاوبەش دەکات، بۆیە Big چاپ دەکرێت و <code>break</code> دەردەچێت.", "s": [["int d = 7;", "گۆڕاوی <code>d</code> دروست دەکات لە جۆری <code>int</code> و بەهای 7ی دەداتێ.", ["d = 7"]], ["int r = d / 2;", "7 / 2 لە <code>int</code> دا 3 دەدات (بەشی دەهەمی نامێنێت). 3 دەخاتە ناو r.", ["r = 3"]], ["switch (r)", "switch بەهای r (3) هەڵدەگرێت و لەگەڵ case ـەکان بەراوردی دەکات.", []], ["case 3:", "3 یەکسانە بە 3؟ بەڵێ. لەبەر ئەوەی case 3 کۆدی نییە، کۆدی case 4 بەکاردێت.", []], ["case 4:", "ئەم case ـە هەمان کۆدی case 3 هاوبەش دەکات. ئەگەر r 4 بووایە، هەمان ئەنجام دەبوو.", []], ["Console.WriteLine(\"Big\");", "<code>Console.WriteLine</code> دەقی Big چاپ دەکات.", []], ["break;", "<code>break</code> لە switch دەردەچێت.", []], ["default:", "ئەگەر r نە 3 نە 4 بووایە، کۆد لێرەوە دەست پێدەکرد.", []], ["Console.WriteLine(\"Small\");", "ئەگەر default بگیرایە، Small چاپ دەکرا.", []], ["break;", "ئەگەر default بگیرایە، <code>break</code> لە switch دەردەچوو.", []]], "sum": "پوختە: چەند caseـێک دەتوانن یەک کۆد هاوبەش بکەن بە نەنووسینی break لە نێوانیان."}]});
ADD(3,{"E": [{"t": "Sum with Loop – کۆکردنەوە بە لووپ", "p": "PDF P.1", "c": "int Value,sum=0;\nConsole.WriteLine(\"Enter the Value\" );\nValue =Convert.ToInt32( Console.ReadLine());\nfor (int i = 1; i <= Value; i++)\n  sum += i;\nConsole.WriteLine(\"the sum of all values is: \"+sum);", "o": "Enter the Value\n5\nthe sum of all values is: 15"}, {"t": "Sum with void Method – کۆکردنەوە بە میسۆدی void", "p": "PDF P.1", "c": "static void printsum(int v)\n{\n  int sum = 0;\n  for (int i = 1; i <= v; i++)\n    sum += i;\n  Console.WriteLine(\"the sum of all values is: \" + sum);\n}\nstatic void Main(string[] args)\n{\n  int Value;\n  Console.WriteLine(\"Enter the Value\");\n  Value = Convert.ToInt32(Console.ReadLine());\n  printsum(Value);\n}", "o": "Enter the Value\n5\nthe sum of all values is: 15"}, {"t": "Sum with int Method – کۆکردنەوە بە میسۆدی int", "p": "PDF P.2", "c": "static int printsum(int v)\n{\n  int sum = 0;\n  for (int i = 1; i <= v; i++)\n    sum += i;\n  return sum;\n}\nstatic void Main(string[] args)\n{\n  int Value;\n  Console.WriteLine(\"Enter the Value\");\n  Value = Convert.ToInt32(Console.ReadLine());\n  Console.WriteLine(\"the sum of all values is: \" + printsum(Value));\n}", "o": "Enter the Value\n5\nthe sum of all values is: 15"}], "EX": [[["int Value,sum=0;", "دوو گۆڕاوی <code>int</code> بە یەکجار دروست دەکات: <code>Value</code> (بەهای نییە) و <code>sum</code> کە بەهای 0ی دەداتێ."], ["Console.WriteLine(\"Enter the Value\" );", "دەقی Enter the Value چاپ دەکات بۆ ئەوەی بەکارهێنەر ژمارەیەک بنووسێت."], ["Value =Convert.ToInt32( Console.ReadLine());", "ئەوەی بەکارهێنەر دەینووسێت دەخوێنێتەوە و بە <code>Convert.ToInt32</code> دەیکات بە ژمارەی تەواو. ئەگەر 5 بنووسێت، Value = 5."], ["for (int i = 1; i <= Value; i++)", "i لە 1 دەست پێدەکات و تا i کەمتر یان یەکسان بێت بە Value (5) لووپەکە بەردەوامە، و هەر جارێک i یەک زیاد دەکات: 1 2 3 4 5."], ["sum += i;", "لە هەر دووبارەبوونەوەیەکدا i دەخاتە سەر sum: 0+1=1، 1+2=3، 3+3=6، 6+4=10، 10+5=15."], ["Console.WriteLine(\"the sum of all values is: \"+sum);", "دەقەکە لەگەڵ بەهای sum (15) بە <code>+</code> دەلکێنێت و چاپی دەکات."]], [["static void printsum(int v)", "میسۆدێک بە ناوی <code>printsum</code> دروست دەکات. <code>void</code> واتە هیچ بەهایەک ناگەڕێنێتەوە، و <code>int v</code> ئەو ژمارەیەیە کە پێی دەدرێت."], ["int sum = 0;", "گۆڕاوی <code>sum</code> دروست دەکات لە جۆری <code>int</code> و بەهای 0ی دەداتێ."], ["for (int i = 1; i <= v; i++)", "i لە 1 تا v (5) دووبارە دەبێتەوە: 1 2 3 4 5."], ["sum += i;", "هەر جارێک i دەخاتە سەر sum: 1 و 3 و 6 و 10 و 15."], ["Console.WriteLine(\"the sum of all values is: \" + sum);", "دەقەکە لەگەڵ sum (15) دەلکێنێت و خودی میسۆدەکە چاپی دەکات."], ["static void Main(string[] args)", "پرۆگرامەکە لێرەوە دەست پێدەکات؛ کۆدی ناو ئەم بلۆکە یەکەم جار جێبەجێ دەبێت."], ["int Value;", "گۆڕاوی <code>Value</code> دروست دەکات لە جۆری <code>int</code>. هێشتا بەهای نییە."], ["Console.WriteLine(\"Enter the Value\");", "دەقی Enter the Value چاپ دەکات."], ["Value = Convert.ToInt32(Console.ReadLine());", "ئەوەی بەکارهێنەر دەینووسێت دەخوێنێتەوە و دەیکات بە ژمارەی تەواو. ئەگەر 5 بنووسێت، Value = 5."], ["printsum(Value);", "میسۆدی <code>printsum</code> بانگ دەکات و بەهای Value (5) دەنێرێت بۆ v. میسۆدەکە خۆی کۆکەی دەدۆزێتەوە و 15 چاپ دەکات."]], [["static int printsum(int v)", "میسۆدێک بە ناوی <code>printsum</code> دروست دەکات. <code>int</code> واتە ژمارەیەکی تەواو دەگەڕێنێتەوە، و <code>int v</code> ئەو ژمارەیەیە کە پێی دەدرێت."], ["int sum = 0;", "گۆڕاوی <code>sum</code> دروست دەکات و 0ی دەداتێ."], ["for (int i = 1; i <= v; i++)", "i لە 1 تا v (5) دووبارە دەبێتەوە: 1 2 3 4 5."], ["sum += i;", "هەر جارێک i دەخاتە سەر sum: 1 و 3 و 6 و 10 و 15."], ["return sum;", "<code>return</code> بەهای sum (15) دەگەڕێنێتەوە بۆ ئەو شوێنەی میسۆدەکە لێوە بانگ کرابوو."], ["static void Main(string[] args)", "پرۆگرامەکە لێرەوە دەست پێدەکات؛ کۆدی ناو ئەم بلۆکە یەکەم جار جێبەجێ دەبێت."], ["int Value;", "گۆڕاوی <code>Value</code> دروست دەکات لە جۆری <code>int</code>. هێشتا بەهای نییە."], [" [["static void hello(string name)", "میسۆدێک دروست دەکات بە ناوی <code>hello</code>. <code>string name</code> ئەو دەقەیە کە پێی دەدرێت. <code>void</code> واتە هیچ نەدەگەڕێنێتەوە.", []], ["Console.WriteLine(\"Hi \" + name);", "لە ناو میسۆدەکە، \"Hi \" لەگەڵ name (Ali) دەلکێنێت و Hi Ali چاپ دەکات.", []], ["static void Main(string[] args)", "پرۆگرامەکە لێرەوە دەست پێدەکات.", []], ["hello(\"Ali\");", "میسۆدی hello بانگ دەکات و دەقی \"Ali\" دەنێرێت. ئێستا name = Ali.", ["name = Ali"]]], "sum": "پوختە: میسۆدی <code>void</code> کارێک دەکات (وەک چاپکردن) و هیچ بەهایەک ناگەڕێنێتەوە."}, {"c": "static int square(int x)\n{\n  return x * x;\n}\nstatic void Main(string[] args)\n{\n  Console.WriteLine(square(5));\n}", "o": "25", "intro": "سەرەتا لە <code>Main</code> میسۆدی <code>square</code>مان بانگ کرد و 5مان نارد. میسۆدەکە لە جۆری <code>int</code>ـە، 5 * 5 دەکات (25) و بە <code>return</code> دەیگەڕێنێتەوە. <code>Console.WriteLine</code> 25 چاپ دەکات.", "s": [["static int square(int x)", "میسۆدێک دروست دەکات بە ناوی <code>square</code>. <code>int</code> واتە ژمارەی تەواو دەگەڕێنێتەوە و <code>int x</code> ئەو ژمارەیەیە کە پێی دەدرێت.", []], ["return x * x;", "x لێک دەدات بە خۆی و ئەنجامەکە دەگەڕێنێتەوە. ئەگەر x = 5، 5 * 5 = 25.", ["x = 5 → 25"]], ["static void Main(string[] args)", "پرۆگرامەکە لێرەوە دەست پێدەکات.", []], ["Console.WriteLine(square(5));", "سەرەتا <code>square(5)</code> بانگ دەکرێت و 25 دەگەڕێتەوە. دواتر <code>Console.WriteLine</code> 25 چاپ دەکات.", []]], "sum": "پوختە: میسۆدی <code>int</code> بەهایەک دەگەڕێنێتەوە بە <code>return</code> و دەتوانرێت لە شوێنی بانگکردنەکە بەکاربهێنرێت."}]});

{t:'Array Max, Min, Sum, Average – گەورەترین، بچووکترین، کۆ و تێکڕا',p:'PDF P.1',c:'int[] array = {12,23,45,67,89,32,45,65,43,22};\nConsole.WriteLine("Largest element = " + array.Max());\nConsole.WriteLine("Smallest element = " + array.Min());\nConsole.WriteLine("Sumation element = " + array.Sum());\nConsole.WriteLine("Sumation element = " + array.Average());',o:'Largest element = 89\nSmallest element = 12\nSumation element = 443\nSumation element = 44.3'},
{t:'Array alpha of 50 Elements – ڕیزی alpha بە ٥٠ شوێن',p:'PDF P.1',c:'// ڕیزێکی ٥٠ شوێنی double ڕادەگەیەنێت\ndouble[] alpha = new double[50];\n// ڕیزەکە پڕ دەکاتەوە\nfor (int i = 0; i < 50; i++)\n{\n  if (i < 25)\n  {\n    // ٢٥ شوێنی یەکەم: دووجای ژمارەی شوێنەکە\n    alpha[i] = i * i;\n  }\n  else\n  {\n    // ٢٥ شوێنی کۆتایی: سێ هێندەی ژمارەی شوێنەکە\n    alpha[i] = 3 * i;\n  }\n}\n// ڕیزەکە چاپ دەکات، ١٠ بەها لە هەر هێڵێک\nConsole.WriteLine("Array alpha:");\nfor (int i = 0; i < 50; i++)\n{\n  // پێش هەر بەهای دەیەم هێڵی نوێ دەکاتەوە\n  if ( i % 10 == 0)\n  {\n    Console.WriteLine();\n  }\n  // بەهاکە بە تابەوە چاپ دەکات\n  Console.Write(alpha[i]+ "\\t");\n}\nConsole.WriteLine(); // هێڵی نوێی کۆتایی',o:'Array alpha:\n\n0\t1\t4\t9\t16\t25\t36\t49\t64\t81\t\n100\t121\t144\t169\t196\t225\t256\t289\t324\t361\t\n400\t441\t484\t529\t576\t75\t78\t81\t84\t87\t\n90\t93\t96\t99\t102\t105\t108\t111\t114\t117\t\n120\t123\t126\t129\t132\t135\t138\t141\t144\t147\t'},
{t:'Odd and Even Count and Sum – ژمارە و کۆی تاک و جووت',p:'PDF P.2',c:'int oddCount = 0, evenCount = 0,oddSum = 0, evenSum = 0,value;\nint[] array = new int[20];\n// داتا دەخوێنێتەوە بۆ ناو ڕیزەکە\nfor (int i = 0; i < 20; i++)\n{\n  Console.Write("Enter number " + (i + 1) + ": ");\n  array[i] = Convert.ToInt32(Console.ReadLine());\n}\n// کۆ و ژمارەی ڕیزەکە دەدۆزێتەوە\nfor (int i = 0; i < 20; i++)\n  if (array[i] % 2==0)\n  {\n    evenCount++;\n    evenSum += array[i];\n  }\n  else\n  {\n    oddCount++;\n    oddSum += array[i];\n  }\n  Console.WriteLine("even count is: "+evenCount);\n  Console.WriteLine("odd count is: " + oddCount);\n  Console.WriteLine("sum of even values is: "+evenSum);\n  Console.WriteLine("sum of odd values is: " + oddSum);',o:'Enter number 1: 1\nEnter number 2: 2\nEnter number 3: 3\nEnter number 4: 4\nEnter number 5: 5\nEnter number 6: 6\nEnter number 7: 7\nEnter number 8: 8\nEnter number 9: 9\nEnter number 10: 10\nEnter number 11: 11\nEnter number 12: 12\nEnter number 13: 13\nEnter number 14: 14\nEnter number 15: 15\nEnter number 16: 16\nEnter number 17: 17\nEnter number 18: 18\nEnter number 19: 19\nEnter number 20: 20\neven count is: 10\nodd count is: 10\nsum of even values is: 110\nsum of odd values is: 100'}
],EX:[
[['int[] array = {12,23,45,67,89,32,45,65,43,22};','گۆڕاوی <code>array</code> دروست دەکات لە جۆری <code>int[]</code> (ڕیزێکی ژمارەی تەواو) و ١٠ بەهای تێدا دادەنێت: 12 و 23 و 45 و 67 و 89 و 32 و 45 و 65 و 43 و 22. شوێنی یەکەم 0یە و شوێنی کۆتایی 9ە.'],['Console.WriteLine("Largest element = " + array.Max());','<code>array.Max()</code> هەموو بەهاکان دەپشکنێت و گەورەترینیان دەدۆزێتەوە: 89. دەقەکە لەگەڵ 89 دەلکێنێت و Largest element = 89 چاپ دەکات.'],['Console.WriteLine("Smallest element = " + array.Min());','<code>array.Min()</code> بچووکترین بەها دەدۆزێتەوە: 12. Smallest element = 12 چاپ دەکات.'],['Console.WriteLine("Sumation element = " + array.Sum());','<code>array.Sum()</code> هەموو بەهاکان کۆدەکاتەوە: 12+23+45+67+89+32+45+65+43+22 = 443. Sumation element = 443 چاپ دەکات.'],['Console.WriteLine("Sumation element = " + array.Average());','<code>array.Average()</code> تێکڕا دەدۆزێتەوە: 443 دابەش بە 10 (ژمارەی بەهاکان) = 44.3. ئەنجامەکە لە جۆری <code>double</code>ـە، بۆیە Sumation element = 44.3 چاپ دەکات.']],
[['double[] alpha = new double[50];','ڕیزی <code>alpha</code> دروست دەکات لە جۆری <code>double[]</code> (ڕیزی ژمارەی دەهەمی) بە ٥٠ شوێن، لە 0 تا 49. هەموو شوێنەکان بەهای 0 وەردەگرن تا دواتر پڕ دەکرێنەوە.'],['for (int i = 0; i < 50; i++)','گۆڕاوی <code>i</code> دروست دەکات لە جۆری <code>int</code> و بەهای 0ی دەداتێ. 0 کەمترە لە 50؟ بەڵێ، True، بۆیە لووپەکە دەست پێدەکات. هەر جارێک i یەک زیاد دەکات: 0 1 2 ... 49، و کاتێک دەبێتە 50 لووپەکە دەوەستێت.'],['if (i < 25)','ئەمە دیاری دەکات i لە کام بەشدایە. کاتێک i = 4، ئایا 4 &lt; 25؟ بەڵێ، True. کاتێک i = 30، ئایا 30 &lt; 25؟ نەخێر، False و دەچێتە <code>else</code>.'],['alpha[i] = i * i;','بۆ ٢٥ شوێنی یەکەم (i لە 0 تا 24)، i لێک دەدات بە خۆی و دەیخاتە شوێنی i. بۆ نموونە i = 4: 4 * 4 = 16، بۆیە alpha[4] = 16.'],['else','ئەگەرنا: کاتێک i یەکسان یان گەورەتر بێت لە 25 (i لە 25 تا 49).'],['alpha[i] = 3 * i;','i لێک دەدات بە 3 و دەیخاتە شوێنی i. بۆ نموونە i = 30: 3 * 30 = 90، بۆیە alpha[30] = 90.'],['Console.WriteLine("Array alpha:");','دەقی Array alpha: چاپ دەکات و دەچێتە هێڵی نوێ.'],['for (int i = 0; i < 50; i++)','لووپی دووەم؛ i دووبارە لە 0 دەست پێدەکات و تا 49 دەڕوات، بۆ ئەوەی هەموو شوێنەکان یەک بە یەک چاپ بکرێن.'],['if ( i % 10 == 0)','<code>%</code> ماوەی دابەشکردن دەدات. بۆ نموونە i = 10: 10 % 10 = 0، ئایا 0 == 0؟ بەڵێ، True. بەڵام i = 7: 7 % 10 = 7، ئایا 7 == 0؟ نەخێر، False. بۆیە تەنها کاتێک i = 0 و 10 و 20 و 30 و 40 ڕاستە.'],['Console.WriteLine();','هێڵێکی بەتاڵ چاپ دەکات، واتە دەچێتە هێڵی نوێ. لە i = 0 هێڵێکی بەتاڵ دوای Array alpha: دروست دەکات و لە i = 10 و 20 و 30 و 40 هێڵێکی نوێ دەست پێدەکات.'],['Console.Write(alpha[i]+ "\\t");','بەهای alpha[i] لەگەڵ تابێک چاپ دەکات و ناچێتە هێڵی نوێ. بۆ نموونە i = 3: alpha[3] = 9، دەنووسرێت 9 و دوای ئەو تابێک.'],['Console.WriteLine();','دوای تەواوبوونی لووپ، دەچێتە هێڵی نوێ بۆ ئەوەی هێڵی کۆتایی ڕێک تەواو بێت.']],
[['int oddCount = 0, evenCount = 0,oddSum = 0, evenSum = 0,value;','پێنج گۆڕاوی <code>int</code> بە یەکجار دروست دەکات. <code>oddCount</code> و <code>evenCount</code> و <code>oddSum</code> و <code>evenSum</code> هەموویان بەهای 0 وەردەگرن، چونکە دەبێت لە 0 دەست پێبکەن بۆ ژماردن و کۆکردنەوە. <code>value</code> هێشتا بەهای نییە و لەم کۆدەدا بەکارنایەت.'],['int[] array = new int[20];','ڕیزی <code>array</code> دروست دەکات لە جۆری <code>int[]</code> (ڕیزی ژمارەی تەواو) بە ٢٠ شوێن، لە 0 تا 19. هەموو شوێنەکان بەهای 0 وەردەگرن تا دواتر پڕ دەکرێنەوە.'],['for (int i = 0; i < 20; i++)','گۆڕاوی <code>i</code> دروست دەکات لە جۆری <code>int</code> و بەهای 0ی دەداتێ. 0 کەمترە لە 20؟ بەڵێ، True. هەر جارێک i یەک زیاد دەکات: 0 1 2 ... 19، و کاتێک دەبێتە 20 لووپەکە دەوەستێت. ئەم لووپە بۆ خوێندنەوەی ٢٠ ژمارەیە.'],['Console.Write("Enter number " + (i + 1) + ": ");','دەقی Enter number لەگەڵ (i + 1) و : چاپ دەکات. بۆ نموونە i = 0: (0 + 1) = 1، بۆیە Enter number 1: چاپ دەکرێت. کەوانەکان پێویستن بۆ ئەوەی i + 1 وەک ژمارە کۆبکرێتەوە و بە دەقەکەوە نەلکێت. <code>Write</code>ـە، بۆیە بەکارهێنەر ژمارەکە لەتەنیشتی دەنووسێت.'],['array[i] = Convert.ToInt32(Console.ReadLine());','<code>ReadLine()</code> ئەوەی بەکارهێنەر نووسیویەتی وەک دەق دەخوێنێتەوە و <code>Convert.ToInt32</code> دەیکات بە ژمارەی تەواو و دەیخاتە شوێنی i لە ڕیزەکە. بۆ نموونە i = 0 و بەکارهێنەر 1 دەنووسێت: array[0] = 1. ئەگەر i = 1 و 2 بنووسێت: array[1] = 2.'],['for (int i = 0; i < 20; i++)','لووپی دووەم؛ i دووبارە لە 0 دەست پێدەکات و تا 19 دەڕوات. ئەم لووپە کەوانەی نییە، بۆیە تەنها فەرمانی <code>if ... else</code> (تا کۆتایی <code>else</code>) دووبارە دەبێتەوە. چوار <code>WriteLine</code>ـەکە دوای لووپەکەن و تەنها یەک جار جێبەجێ دەبن.'],['if (array[i] % 2==0)','<code>%</code> ماوەی دابەشکردن دەدات. بۆ نموونە array[1] = 2: 2 % 2 = 0، ئایا 0 == 0؟ بەڵێ، True، واتە جووتە. بەڵام array[0] = 1: 1 % 2 = 1، ئایا 1 == 0؟ نەخێر، False، دەچێتە <code>else</code>.'],['evenCount++;','ئەگەر ژمارەکە جووت بوو، <code>evenCount</code> یەک زیاد دەکات. بۆ نموونە لە array[1] = 2 دەبێتە 1، و دوای هەموو ژمارە جووتەکان 10 دەبێت.'],['evenSum += array[i];','ژمارەی جووت دەخاتە سەر <code>evenSum</code>. بۆ نموونە array[1] = 2: 0 + 2 = 2، دواتر 4: 2 + 4 = 6. دوای هەموویان: 2 + 4 + ... + 20 = 110.'],['else','ئەگەرنا: کاتێک ژمارەکە جووت نەبێت، واتە تاک بێت.'],['oddCount++;','ئەگەر ژمارەکە تاک بوو، <code>oddCount</code> یەک زیاد دەکات. بۆ نموونە لە array[0] = 1 دەبێتە 1، و دوای هەموو ژمارە تاکەکان 10 دەبێت.'],['oddSum += array[i];','ژمارەی تاک دەخاتە سەر <code>oddSum</code>. بۆ نموونە array[0] = 1: 0 + 1 = 1، دواتر 3: 1 + 3 = 4. دوای هەموویان: 1 + 3 + ... + 19 = 100.'],['Console.WriteLine("even count is: "+evenCount);','دەقەکە لەگەڵ بەهای evenCount بە <code>+</code> دەلکێنێت و even count is: 10 چاپ دەکات.'],['Console.WriteLine("odd count is: " + oddCount);','دەقەکە لەگەڵ بەهای oddCount دەلکێنێت و odd count is: 10 چاپ دەکات.'],['Console.WriteLine("sum of even values is: "+evenSum);','دەقەکە لەگەڵ بەهای evenSum دەلکێنێت و sum of even values is: 110 چاپ دەکات.'],['Console.WriteLine("sum of odd values is: " + oddSum);','دەقەکە لەگەڵ بەهای oddSum دەلکێنێت و sum of odd values is: 100 چاپ دەکات.']]
],EXSUM:['سەرەتا <code>array</code> دروست دەکات لە جۆری <code>int[]</code> (ڕیزێکی ژمارەی تەواو) بە ١٠ بەها: 12 و 23 و 45 و 67 و 89 و 32 و 45 و 65 و 43 و 22. دواتر <code>array.Max()</code> هەموو بەهاکان دەپشکنێت و گەورەترین دەدۆزێتەوە، 89، و Largest element = 89 چاپ دەکرێت. <code>array.Min()</code> بچووکترین دەدۆزێتەوە، 12، و Smallest element = 12 چاپ دەکرێت. <code>array.Sum()</code> هەموو بەهاکان کۆدەکاتەوە: 12 + 23 + 45 + 67 + 89 + 32 + 45 + 65 + 43 + 22 = 443، و چاپ دەکرێت. لە کۆتاییدا <code>array.Average()</code> تێکڕا دەدۆزێتەوە: 443 / 10 = 44.3، و چاپ دەکرێت.',
'سەرەتا <code>alpha</code> دروست دەکات لە جۆری <code>double[]</code> بە ٥٠ شوێن (0 تا 49)، هەموویان 0ن. لووپی یەکەم، i لە 0 تا 49 دەڕوات و لە هەر جارێکدا <code>if (i &lt; 25)</code> دەپشکنێت. بۆ i لە 0 تا 24 ڕاستە و alpha[i] = i * i، بۆ نموونە alpha[4] = 16 و alpha[24] = 576. بۆ i لە 25 تا 49، <code>else</code> بەکاردێت و alpha[i] = 3 * i، بۆ نموونە alpha[25] = 75 و alpha[30] = 90 و alpha[49] = 147. دواتر Array alpha: چاپ دەکات. لووپی دووەم هەموو بەهاکان چاپ دەکات و دوای هەر بەهایەک تابێک دەنووسێت. کاتێک <code>i % 10 == 0</code> بێت (i = 0 و 10 و 20 و 30 و 40)، <code>WriteLine()</code> هێڵی نوێ دەکاتەوە پێش چاپکردنی ئەو بەهایە، بۆیە ١٠ بەها لە هەر هێڵێکدایە و پێنج هێڵ دروست دەبن. فەرمانی کۆتایی <code>WriteLine()</code> هێڵی کۆتایی تەواو دەکات.',

<div class="code-tools"><button class="copy-btn" onclick="copyCode(${k},this)">📋 کۆپی کردنی کۆد</button>${lab===4?`<label class="ku-sw"><span>نموونەی کوردی</span><input type="checkbox" onchange="toggleKu(${k},this.checked)"><i class="sw"></i></label>`:''}</div>
<div class="code-box"><div class="line-numbers">${L.map((_,i)=>`<span>${i+1}</span>`).join('')}</div><div class="code-content"><pre>${L.map(hl).join('\n')}</pre></div></div>
<div class="output-box"><div class="output-header">:دەرەنجام &nbsp;|&nbsp; Output:</div><div class="output-content">${esc(e.o)}</div></div>
<div class="expl-box"><div class="expl-title">📚 ڕوونکردنەوە:</div><div class="walk"><span class="wl">کارەکەی ئەم کۆدە بەم شێوەیەیە:</span>${fx(EXSUM[k])}</div><ul>${expl(e,EX[k])}</ul></div>${moreHtml(k)}</div></div>`}).join('');}
function setLab(i){pinReset();curLab=i;KU_ON={};const d=LABS[i];E=d.E;EX=d.EX;EXSUM=d.EXSUM;MORE=d.MORE;
 document.querySelectorAll('.lab').forEach((b,k)=>b.classList.toggle('active',k===i));
 build(i);curTab=0;pinSync();window.scrollTo({top:0,behavior:'smooth'});}
let curTab=0,inMore=false;const PS=[{on:false,wide:false,lp:false,t:null,w:'pinWrap',x:'pinTxt'},{on:false,wide:false,lp:false,t:null,w:'pinWrap2',x:'pinTxt2'}];
function pinBox(n){const c=document.querySelectorAll('.content')[curTab];return c&&c.querySelector(n?'#more'+(curTab-1)+' .code-box':'.example > .code-box');}
let HS=0;
function pinLabel(q){if(!q.on)return HS===0?'ئایکۆنەکە بگرە و ڕایکێشە بۆ دەستی ڕاست ➡️':'pin';if(q.wide)return HS===1?'ئێستا ڕایکێشە بۆ سەرەوە ⬆️':'pinned · full';return 'pinned';}
function pinApply(n){const q=PS[n],w=document.getElementById(q.w);w.classList.toggle('on',q.on);w.classList.toggle('full',q.on&&q.wide);w.classList.toggle('dock',!!q.dock);document.getElementById(q.x).textContent=pinLabel(q);pinSync();}
function pinFree(b){b.classList.remove('pinned','wide');b.style.left='';b.style.width='';b.style.top='';if(b._sp){b._sp.remove();b._sp=null;}}
function pinSync(){const w1=document.getElementById('pinWrap'),w2=document.getElementById('pinWrap2');
 if(curTab<1){w1.classList.remove('show');w2.classList.remove('show');[0,1].forEach(n=>{const b=pinBox(n);if(b)pinFree(b);});return;}
 const m=document.getElementById('more'+(curTab-1));inMore=false;
 if(m&&m.classList.contains('open')){const r=m.getBoundingClientRect();inMore=r.top<window.innerHeight*0.55&&r.bottom>120;}
 const b0=pinBox(0);let mainIn=false;if(b0&&b0.parentNode){const nr=(b0._sp||b0).getBoundingClientRect(),pr=b0.parentNode.getBoundingClientRect();mainIn=nr.top<window.innerHeight*0.6&&pr.bottom>200;}
 w1.classList.toggle('show',mainIn&&!inMore);w2.classList.toggle('show',inMore);
 [0,1].forEach(n=>{const q=PS[n],b=pinBox(n);if(!b)return;const cont=n?m:b.parentNode;
  if(!cont||(n&&!m.classList.contains('open'))){pinFree(b);return;}
  const nat=(b._sp||b).getBoundingClientRect(),cr=cont.getBoundingClientRect(),want=q.on&&(n?inMore:!inMore);
  if(want&&nat.top<0&&cr.bottom>0){
   if(!b._sp){const sp=document.createElement('div');sp.className='pin-spacer';sp.style.height=(b.offsetHeight+18)+'px';b.parentNode.insertBefore(sp,b);b._sp=sp;}
   b.classList.add('pinned');b.classList.toggle('wide',q.wide);
   const sr=b._sp.getBoundingClientRect();if(q.wide){b.style.left='';b.style.width='';}else{b.style.left=sr.left+'px';b.style.width=sr.width+'px';}
   b.style.top=Math.min(0,cr.bottom-b.offsetHeight)+'px';}
  else pinFree(b);});
 document.body.style.paddingTop='20px';}
function pinClick(n){const q=PS[n];if(q.lp){q.lp=false;return;}if(q.dock){q.dock=false;pinApply(n);return;}q.on=!q.on;if(!q.on)q.wide=false;pinApply(n);}
function pinDown(n,e){const q=PS[n];q.lp=false;q.mv=false;q.dir='';clearTimeout(q.t);q.x0=e.clientX;q.y0=e.clientY;q.dr=true;
 try{e.currentTarget.setPointerCapture(e.pointerId);}catch(_){}
 q.t=setTimeout(()=>{q.lp=true;q.dr=false;q.dock=false;if(!q.on){q.on=true;q.wide=true;}else q.wide=!q.wide;if(HS===0&&q.on&&q.wide)HS=1;pinApply(n);if(navigator.vibrate)navigator.vibrate(40);},700);}
function pinMove(n,e){const q=PS[n];if(!q.dr)return;const dx=e.clientX-q.x0,dy=e.clientY-q.y0;
 if(Math.abs(dx)<10&&Math.abs(dy)<10)return;
 clearTimeout(q.t);q.mv=true;
 const b=e.currentTarget,w=document.getElementById(q.w),tx=document.getElementById(q.x);
 q.dir=Math.abs(dx)>=Math.abs(dy)?(dx>40?'r':''):(dy>40?'d':(dy<-40?'u':''));
 b.classList.add('drag');b.style.transform='translate('+Math.max(0,Math.min(50,dx))+'px,'+Math.max(-50,Math.min(50,dy))+'px)';
 w.querySelector('.pin-pill').classList.toggle('hint',!!q.dir);
 tx.textContent=q.dir==='r'?'ئێستا بەربدە ➡️':q.dir==='d'?'ئێستا بەربدە ⬇️':q.dir==='u'?'ئێستا بەربدە ⬆️':pinLabel(q);}
function pinUp(n,e){const q=PS[n];clearTimeout(q.t);if(!q.dr)return;q.dr=false;
 const b=e.currentTarget;b.classList.remove('drag');b.style.transform='';
 document.getElementById(q.w).querySelector('.pin-pill').classList.remove('hint');
 if(q.mv){q.lp=true;if(q.dir==='u'){if(HS===1)HS=2;q.dock=true;if(navigator.vibrate)navigator.vibrate(30);}else if(q.dir==='r'){if(HS===0)HS=1;q.dock=false;q.on=true;q.wide=true;if(navigator.vibrate)navigator.vibrate(30);}else if(q.dir==='d'){q.dock=false;q.on=true;q.wide=false;if(navigator.vibrate)navigator.vibrate(30);}pinApply(n);}}
function pinReset(){if(curTab>=1)[0,1].forEach(n=>{const b=pinBox(n);if(b)pinFree(b);});PS.forEach(q=>{q.on=false;q.wide=false;document.getElementById(q.w).classList.remove('on','full','dock');q.dr=false;q.dock=false;document.getElementById(q.x).textContent=pinLabel(q);});}
window.addEventListener('scroll',pinSync,{passive:true});window.addEventListener('resize',pinSync);
function showTab(i){pinReset();curTab=i;pinSync();setTimeout(pinSync,450);document.querySelectorAll('.tab').forEach((t,k)=>t.classList.toggle('active',k===i));
 document.querySelectorAll('.content').forEach((c,k)=>c.classList.toggle('active',k===i));
 const t=i===0?null:document.querySelectorAll('.content')[i].querySelector('.title-row');
 if(t)t.scrollIntoView({behavior:'smooth',block:'start'});else window.scrollTo({top:0,behavior:'smooth'});}
setLab(0);
</script>
</body>
</html>
